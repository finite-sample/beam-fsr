name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Posit Package Manager has no pcaPP 2.0-7 binary (a BMA dependency) and
      # renv does not fall back, so build everything from CRAN sources.
      RENV_CONFIG_PPM_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2 (2026-10-08)
        with:
          use-public-rspm: false
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2 (2026-10-08)
        env:
          # bestsubset installs from GitHub; unauthenticated API calls get throttled.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Tests
        run: Rscript tests/test_methods.R
      - name: Lint
        run: |
          Rscript -e 'install.packages("lintr")'
          Rscript -e 'l <- c(lintr::lint_dir("R"), lintr::lint_dir("tests")); print(l); quit(status = length(l) > 0)'
