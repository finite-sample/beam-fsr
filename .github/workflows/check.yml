name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Tests
        run: Rscript tests/test_methods.R
      - name: Lint
        run: |
          Rscript -e 'install.packages("lintr")'
          Rscript -e 'l <- c(lintr::lint_dir("R"), lintr::lint_dir("tests")); print(l); quit(status = length(l) > 0)'
